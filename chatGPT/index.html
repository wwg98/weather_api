<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>단기예보 조회</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4 fw-bold">단기예보 조회</h1>

      <div class="card p-4 mb-4 shadow-sm">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">격자 좌표 엑셀 파일</label>
            <input type="file" id="excelFile" class="form-control" accept=".xlsx, .xls" />
          </div>

          <div class="col-md-3">
            <label class="form-label">날짜 선택</label>
            <input type="date" id="datePicker" class="form-control" />
          </div>

          <div class="col-md-3">
            <label class="form-label">지역 선택</label>
            <select id="regionSelect" class="form-select">
              <option value="">엑셀 업로드 후 선택</option>
            </select>
          </div>

          <div class="col-md-2 d-flex align-items-end">
            <button id="searchBtn" class="btn btn-primary w-100">조회</button>
          </div>
        </div>
      </div>

      <div id="infoBox" class="alert alert-info">엑셀 파일을 업로드하세요.</div>

      <table class="table table-bordered table-hover text-center bg-white">
        <thead class="table-dark">
          <tr>
            <th>날짜</th>
            <th>시간</th>
            <th>온도</th>
            <th>습도</th>
          </tr>
        </thead>
        <tbody id="weatherBody">
          <tr>
            <td colspan="4">조회 결과가 없습니다.</td>
          </tr>
        </tbody>
      </table>

      <ul id="pagination" class="pagination justify-content-center"></ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <script>
      const serviceKey =
        "jNu%2FUDr0Q2KYQ9rDGnLJqo4ahkjIQrHpn9wOnGbNXkmLqSFCj5rE6fYoLKFF1ELf5Yr4JDkQeCisuwGmsVfbOw%3D%3D";

      const excelFile = document.querySelector("#excelFile");
      const datePicker = document.querySelector("#datePicker");
      const regionSelect = document.querySelector("#regionSelect");
      const searchBtn = document.querySelector("#searchBtn");
      const weatherBody = document.querySelector("#weatherBody");
      const pagination = document.querySelector("#pagination");
      const infoBox = document.querySelector("#infoBox");

      let regions = [];
      let weatherList = [];
      let currentPage = 1;
      const rowsPerPage = 10;

      datePicker.value = new Date().toISOString().slice(0, 10);

      excelFile.addEventListener("change", e => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();

        reader.onload = event => {
          const data = new Uint8Array(event.target.result);
          const workbook = XLSX.read(data, { type: "array" });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet);

          regions = rows
            .map(row => {
              const step1 = row["1단계"] || "";
              const step2 = row["2단계"] || "";
              const step3 = row["3단계"] || "";

              return {
                name: `${step1} ${step2} ${step3}`.trim(),
                nx: row["격자 X"],
                ny: row["격자 Y"],
              };
            })
            .filter(region => region.name && region.nx && region.ny);

          renderRegionOptions();

          infoBox.textContent = `총 ${regions.length}개의 지역을 불러왔다.`;
        };

        reader.readAsArrayBuffer(file);
      });

      function renderRegionOptions() {
        regionSelect.innerHTML = `<option value="">지역 선택</option>`;

        regions.forEach((region, index) => {
          const option = document.createElement("option");
          option.value = index;
          option.textContent = region.name;
          regionSelect.appendChild(option);
        });
      }

      searchBtn.addEventListener("click", async () => {
        const selectedIndex = regionSelect.value;

        if (!datePicker.value) {
          alert("날짜를 선택하세요.");
          return;
        }

        if (selectedIndex === "") {
          alert("지역을 선택하세요.");
          return;
        }

        const region = regions[selectedIndex];
        const baseDate = datePicker.value.replaceAll("-", "");
        const baseTime = "0500";

        await getWeatherData(baseDate, baseTime, region.nx, region.ny);
      });

      async function getWeatherData(baseDate, baseTime, nx, ny) {
        const url =
          `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst` +
          `?serviceKey=${serviceKey}` +
          `&pageNo=1` +
          `&numOfRows=1000` +
          `&dataType=JSON` +
          `&base_date=${baseDate}` +
          `&base_time=${baseTime}` +
          `&nx=${nx}` +
          `&ny=${ny}`;

        try {
          infoBox.textContent = "예보 데이터를 조회 중이다.";

          const response = await fetch(url);

          if (!response.ok) {
            throw new Error("API 요청 실패");
          }

          const data = await response.json();
          const items = data.response.body.items.item;

          weatherList = convertWeatherData(items);
          currentPage = 1;

          renderWeatherTable();
          renderPagination();

          infoBox.textContent = `총 ${weatherList.length}개의 시간별 데이터를 조회했다.`;
        } catch (error) {
          console.error(error);
          infoBox.textContent = "예보 데이터를 불러오지 못했다.";
        }
      }

      function convertWeatherData(items) {
        const result = {};

        items.forEach(item => {
          const key = `${item.fcstDate}_${item.fcstTime}`;

          if (!result[key]) {
            result[key] = {
              date: item.fcstDate,
              time: item.fcstTime,
              temp: "-",
              humidity: "-",
            };
          }

          if (item.category === "TMP") {
            result[key].temp = item.fcstValue;
          }

          if (item.category === "REH") {
            result[key].humidity = item.fcstValue;
          }
        });

        return Object.values(result).sort((a, b) => {
          return `${a.date}${a.time}`.localeCompare(`${b.date}${b.time}`);
        });
      }

      function renderWeatherTable() {
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageItems = weatherList.slice(start, end);

        if (pageItems.length === 0) {
          weatherBody.innerHTML = `<tr><td colspan="4">조회 결과가 없습니다.</td></tr>`;
          return;
        }

        weatherBody.innerHTML = pageItems
          .map(item => {
            return `
            <tr>
              <td>${formatDate(item.date)}</td>
              <td>${formatTime(item.time)}</td>
              <td>${item.temp}℃</td>
              <td>${item.humidity}%</td>
            </tr>
          `;
          })
          .join("");
      }

      function renderPagination() {
        const totalPages = Math.ceil(weatherList.length / rowsPerPage);
        pagination.innerHTML = "";

        for (let i = 1; i <= totalPages; i++) {
          const li = document.createElement("li");
          li.className = `page-item ${i === currentPage ? "active" : ""}`;

          li.innerHTML = `<button class="page-link">${i}</button>`;

          li.addEventListener("click", () => {
            currentPage = i;
            renderWeatherTable();
            renderPagination();
          });

          pagination.appendChild(li);
        }
      }

      function formatDate(date) {
        return `${date.slice(0, 4)}-${date.slice(4, 6)}-${date.slice(6, 8)}`;
      }

      function formatTime(time) {
        return `${time.slice(0, 2)}:${time.slice(2, 4)}`;
      }
    </script>
  </body>
</html>
